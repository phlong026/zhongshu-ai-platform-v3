<!doctype html>

<style>
.pcard{display:flex;align-items:center;background:#fff;border-radius:11px;padding:12px 14px;margin-bottom:11px;gap:13px}
.pcard img{width:66px;height:66px;border-radius:50%;object-fit:cover}
.pcard .n{font-size:17.5px;line-height:26px;font-weight:700}
.pcard .r{font-size:12px;color:#8892a6;line-height:18px}
.pcard .lk{color:#94501e;font-size:12px}
.quick{display:flex;background:#fff;border-radius:10px;height:66px;margin-bottom:11px}
.quick>div{flex:1;display:flex;align-items:center;padding:0 13px;gap:10px}
.quick>div+div{border-left:1px solid #f3efea}
.quick img{width:26px;height:30px;object-fit:contain}
.quick .c{display:block;font-size:21px;line-height:22px;font-weight:700;color:#9a4c19}
.quick .t{font-size:14px}
.quick .s{display:block;font-size:11px;color:var(--muted)}
.sec{background:#fff;border-radius:11px;padding:6px 13px;margin-bottom:11px}
.sec.pad{padding:13px}
.srow{display:flex;align-items:center;height:48px;gap:14px;font-size:13.5px}
.srow+.srow{border-top:1px solid #f2efeb}
.srow img{width:22px;height:25px;object-fit:contain}
.srow .grow{display:flex;align-items:center;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.two>div{display:flex;align-items:center;gap:12px;height:58px;padding:0 12px;background:#fbf9f5;border-radius:7px;font-size:13px}
.two img{width:28px;height:32px;object-fit:contain}
.two .ico{width:24px;height:24px}
.two b{font-weight:500;display:block}
.two span{font-size:11px;color:var(--muted)}
.two>div.hl{background:#f7efe5;outline:1px solid #e3cdb2}
.course{display:flex;padding:5px;background:#fcfaf6;border-radius:8px;gap:13px}
.course img{width:150px;height:100px;border-radius:6px;object-fit:cover}
.course .tg{font-size:10.5px;color:#9b4f1d}
.course .tt{font-size:13.5px;font-weight:500;line-height:20px}
.course .st{font-size:11.5px;color:#8892a6;margin-top:5px}
.course .cn{font-size:12px;color:#9b4f1d;margin-top:8px}
.desc{font-size:12px;color:#8892a6;margin:3px 0 10px}
.logout{height:44px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;color:#7a7d83;font-size:15px}
</style></head>
