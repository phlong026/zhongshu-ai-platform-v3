spring.application.name=yudao-design-provider
spring.main.allow-circular-references=false
spring.main.lazy-initialization=false
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
yudao.info.base-package=cn.iocoder.yudao
yudao.info.version=1.0.0
# Signed organization mapping owns tenant context; user/visit tenant filters must not run in this process.
yudao.tenant.enable=false
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=NONE
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
server.port=${DP_SERVER_PORT:48090}
server.shutdown=graceful

# Runtime and migration use independent credentials. Secrets have no artifact defaults.
spring.datasource.dynamic.primary=master
spring.datasource.dynamic.strict=true
spring.datasource.dynamic.datasource.master.url=${DP_PG_URL:jdbc:postgresql://postgres-design:5432/zhongshu_design_provider}
spring.datasource.dynamic.datasource.master.username=${DP_PG_USERNAME:design_provider_app}
spring.datasource.dynamic.datasource.master.password=${DP_PG_PASSWORD}
spring.datasource.dynamic.datasource.master.driver-class-name=org.postgresql.Driver
spring.data.redis.host=${DP_REDIS_HOST:redis-design}
spring.data.redis.port=${DP_REDIS_PORT:6379}
spring.data.redis.username=${DP_REDIS_USERNAME:design_provider_app}
spring.data.redis.password=${DP_REDIS_PASSWORD}
spring.data.redis.database=${DP_REDIS_DATABASE:0}
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s
spring.data.redis.repositories.enabled=false

# The endpoint stays disabled unless the real PG, Redis, service mapping, billing and runtime are ready.
zhongshu.design.capability.enabled=${DP_CAPABILITY_ENABLED:true}
zhongshu.design.asset.storage.provider=${DP_STORAGE_PROVIDER:cos}
zhongshu.design.asset.moderation.provider=${DP_MODERATION_PROVIDER:real}
# B bills company points and has no daily usage quota; 0 is the adapter's explicit unlimited mode.
zhongshu.design.asset.moderation.daily-limit=0
zhongshu.design.driver-enabled=${DP_DRIVER_ENABLED:false}
zhongshu.design.driver-delay-ms=${DP_DRIVER_DELAY_MS:10000}
zhongshu.design.driver-initial-delay-ms=${DP_DRIVER_INITIAL_DELAY_MS:20000}
zhongshu.design.cancel-grace-minutes=${DP_CANCEL_GRACE_MINUTES:10}
zhongshu.design.no-runtime-grace-minutes=${DP_NO_RUNTIME_GRACE_MINUTES:30}
zhongshu.ai.provider-code=${DP_AI_PROVIDER_CODE:apilio}
zhongshu.ai.internal-secret=${DP_RUNTIME_SHARED_SECRET:}
zhongshu.ai.internal-replay-window=300
zhongshu.design.provider.note-polish.per-minute=${DP_NOTE_POLISH_PER_MINUTE:10}
zhongshu.design.provider.note-polish.max-concurrent=${DP_NOTE_POLISH_MAX_CONCURRENT:8}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
knife4j.enable=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=true
management.health.redis.enabled=true
