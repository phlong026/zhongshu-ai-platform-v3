spring.main.web-application-type=none
spring.flyway.enabled=false
spring.flyway.url=${DP_MIGRATION_URL:jdbc:postgresql://postgres-design:5432/zhongshu_design_provider}
spring.flyway.user=${DP_MIGRATION_USERNAME:design_provider_owner}
spring.flyway.password=${DP_MIGRATION_PASSWORD}
spring.flyway.locations=classpath:db/migration/platform,classpath:db/migration/identity,classpath:db/migration/design,classpath:db/migration/commerce,classpath:db/migration/ai-orchestration,classpath:db/migration/design-capability,classpath:db/migration/design-provider
spring.flyway.table=flyway_schema_history
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.fail-on-missing-locations=true
