# api2.zszhj.com → 新平台后端（员工端小程序专用子域名，与旧后端 api.zszhj.com 完全隔离）
# 部署位置：/etc/nginx/conf.d/api2.zszhj.com.conf
# 证书：api2.zszhj.com 的 HTTPS 证书（EdgeOne 托管则走 EdgeOne 回源 80；自签/ACME 则本机 443）
server {
    listen 80;
    server_name api2.zszhj.com;

    # EdgeOne/CDN 回源 or ACME http-challenge
    location / {
        proxy_pass http://127.0.0.1:48081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI 生成轮询/大图上传
        client_max_body_size 50m;  # 工程凭据/内容素材上传上限
    }
}
