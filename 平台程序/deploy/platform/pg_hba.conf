# No network superuser login, no cross-database login (including default postgres DB).
local all postgres peer
local zhongshu_platform_b platform_owner scram-sha-256
local zhongshu_platform_b platform_app scram-sha-256
local all all reject
host zhongshu_platform_b platform_owner all scram-sha-256
host zhongshu_platform_b platform_app all scram-sha-256
host all all all reject
