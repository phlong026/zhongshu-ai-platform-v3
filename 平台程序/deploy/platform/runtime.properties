# Non-secret defaults. Network targets and migration locks are enforced by CLI arguments.
spring.datasource.dynamic.primary=master
spring.datasource.dynamic.strict=true
spring.datasource.dynamic.datasource.master.driver-class-name=org.postgresql.Driver
spring.datasource.dynamic.druid.initial-size=1
spring.datasource.dynamic.druid.min-idle=1
spring.datasource.dynamic.druid.max-active=20
spring.datasource.dynamic.druid.max-wait=5000
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
spring.task.scheduling.pool.size=2
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
server.tomcat.threads.max=64
server.tomcat.max-connections=256
server.tomcat.accept-count=50
# Per B process; reject excess remote design calls before persistence/billing, reserving HTTP workers.
zhongshu.design.remote.max-in-flight=16
zhongshu.design.remote.max-in-flight-per-org=4
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=45s
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
knife4j.enable=false
yudao.security.mock-enable=false
