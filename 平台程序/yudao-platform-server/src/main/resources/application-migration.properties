# Only the `migrate` subcommand consumes this profile, using a non-web context without component scanning.
spring.main.web-application-type=none
spring.flyway.enabled=false
spring.flyway.url=${PF_MIGRATION_URL:jdbc:postgresql://postgres-b:5432/zhongshu_platform_b}
spring.flyway.user=platform_owner
# spring.flyway.password must come from the separately mounted owner secret.
spring.config.import=file:/etc/platform/runtime.properties,file:/run/secrets/platform.properties,configtree:/run/secrets/
