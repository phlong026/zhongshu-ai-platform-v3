spring.datasource.dynamic.primary=master
spring.datasource.dynamic.strict=true
spring.datasource.dynamic.datasource.master.url=${PF_PG_URL:jdbc:postgresql://postgres-b:5432/zhongshu_platform_b}
spring.datasource.dynamic.datasource.master.username=${PF_PG_USERNAME:platform_app}
spring.datasource.dynamic.datasource.master.driver-class-name=org.postgresql.Driver
# Passwords are supplied through an external configtree; no defaults in the artifact.
spring.datasource.dynamic.druid.initial-size=1
spring.datasource.dynamic.druid.min-idle=1
spring.datasource.dynamic.druid.max-active=10
spring.datasource.dynamic.druid.max-wait=10000
spring.datasource.dynamic.druid.validation-query=SELECT 1
spring.datasource.dynamic.druid.validation-query-timeout=5
spring.datasource.dynamic.druid.pool-prepared-statements=false
spring.datasource.dynamic.druid.max-pool-prepared-statement-per-connection-size=0
spring.data.redis.host=${PF_REDIS_HOST:redis-b}
spring.data.redis.port=${PF_REDIS_PORT:6379}
spring.data.redis.username=${PF_REDIS_USERNAME:platform_app}
spring.data.redis.database=0
spring.data.redis.connect-timeout=5s
spring.data.redis.timeout=5s
# These locations are an allowlist shared by the isolated migration command and artifact checks.
spring.flyway.locations=classpath:db/migration/platform-bootstrap,classpath:db/migration/platform,classpath:db/migration/pf,classpath:db/migration/franchise,classpath:db/migration/franchise-system,classpath:db/migration/platform-wallet,classpath:db/migration/franchise-asset,classpath:db/migration/franchise-design-remote
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.fail-on-missing-locations=true
