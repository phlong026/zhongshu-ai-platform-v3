spring.application.name=yudao-platform-server
spring.main.allow-circular-references=true
spring.main.lazy-initialization=false
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=32MB
spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.serialization.write-durations-as-timestamps=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.cache.type=REDIS
spring.cache.redis.time-to-live=1h
spring.data.redis.repositories.enabled=false
spring.task.scheduling.pool.size=4
# Running the API must never change the schema. Migration uses a separate owner command.
spring.flyway.enabled=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.quartz.auto-startup=false
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
# The optional public-account client is not part of B employee login.
spring.autoconfigure.exclude=com.binarywang.spring.starter.wxjava.mp.config.WxMpAutoConfiguration
server.port=${PF_SERVER_PORT:48080}
server.shutdown=graceful
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=NONE
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
mybatis-plus.global-config.banner=false
mybatis-plus.type-aliases-package=cn.iocoder.yudao.module.*.dal.dataobject
mybatis-plus.encryptor.password=${PF_MYBATIS_ENCRYPTOR_PASSWORD:}
mybatis-plus-join.banner=false
mybatis-plus-join.sub-table-logic=true
mybatis-plus-join.ms-cache=true
mybatis-plus-join.table-alias=t
mybatis-plus-join.logic-del-type=on
easy-trans.is-enable-global=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
knife4j.enable=false
aj.captcha.cache-type=redis
aj.captcha.water-mark=
yudao.info.version=1.0.0
yudao.info.base-package=cn.iocoder.yudao
yudao.web.admin-ui.url=${PF_ADMIN_UI_URL:}
yudao.web.cors.allowed-origin-patterns=${PF_CORS_ALLOWED_ORIGINS:}
yudao.xss.enable=true
yudao.security.mock-enable=false
yudao.security.permit-all-urls[0]=/actuator/health/readiness
yudao.security.permit-all-urls[1]=/actuator/health/liveness
yudao.api-encrypt.enable=false
yudao.websocket.enable=true
yudao.websocket.path=/infra/ws
yudao.websocket.sender-type=local
yudao.codegen.base-package=cn.iocoder.yudao
yudao.codegen.db-schemas=public
yudao.codegen.front-type=20
yudao.codegen.vo-type=10
yudao.codegen.delete-batch-enable=true
yudao.codegen.unit-test-enable=false
yudao.codegen.import-enable=false
yudao.tenant.enable=true
yudao.tenant.ignore-urls[0]=/actuator/health/readiness
yudao.tenant.ignore-urls[1]=/actuator/health/liveness
yudao.tenant.ignore-visit-urls[0]=/admin-api/system/user/profile/**
yudao.tenant.ignore-visit-urls[1]=/admin-api/system/auth/**
yudao.tenant.ignore-caches=user_role_ids,permission_menu_ids,oauth_client,notify_template,mail_account,mail_template,sms_template
yudao.sms-code.expire-times=10m
yudao.sms-code.send-frequency=1m
yudao.sms-code.send-maximum-quantity-per-day=10
yudao.sms-code.begin-code=100000
yudao.sms-code.end-code=999999

platform.legacy-design-bridge.enabled=false
# B calls A through a dedicated service contract. Key material is supplied only by external configuration.
zhongshu.design.remote.enabled=true
zhongshu.design.remote.origin=${PF_DESIGN_ORIGIN:}
zhongshu.design.remote.caller-app-id=${PF_DESIGN_CALLER_APP_ID:}
zhongshu.design.remote.active-key-id=${PF_DESIGN_ACTIVE_KEY_ID:}
# Set zhongshu.design.remote.keys.<active-key-id> to a dedicated base64 key in platform.properties.
# A's anonymous published-case catalog is a separate fixed HTTPS origin and never uses the signed remote origin.
zhongshu.design.public-cases.origin=${PF_DESIGN_PUBLIC_CASES_ORIGIN:}
platform.identity.wechat.provider=${PF_WX_PROVIDER:real}
platform.identity.wechat.apps[0].appid=${PF_WX_STAFF_APPID:}
platform.identity.wechat.apps[0].secret=${PF_WX_STAFF_APPSECRET:}
# The system miniapp client shares B employee credentials.
wx.miniapp.appid=${platform.identity.wechat.apps[0].appid}
wx.miniapp.secret=${platform.identity.wechat.apps[0].secret}
wx.miniapp.config-storage.type=RedisTemplate
wx.miniapp.config-storage.key-prefix=platform-b:wx-miniapp
wx.miniapp.config-storage.http-client-type=HttpComponents
platform.identity.sms.provider=${PF_SMS_PROVIDER:real}
platform.identity.sms.sdk-app-id=${PF_SMS_SDK_APP_ID:}
platform.identity.sms.sign-name=${PF_SMS_SIGN_NAME:}
platform.identity.sms.template-id=${PF_SMS_TEMPLATE_ID:}
platform.identity.sms.secret-id=${PF_SMS_SECRET_ID:}
platform.identity.sms.secret-key=${PF_SMS_SECRET_KEY:}
platform.identity.sms.region=${PF_SMS_REGION:ap-guangzhou}
zhongshu.franchise.asset.storage.provider=${PF_ASSET_STORAGE_PROVIDER:cos}
zhongshu.franchise.asset.storage.cos.endpoint=${PF_ASSET_COS_ENDPOINT:}
zhongshu.franchise.asset.storage.cos.region=${PF_ASSET_COS_REGION:}
zhongshu.franchise.asset.storage.cos.bucket=${PF_ASSET_COS_BUCKET:}
zhongshu.franchise.asset.storage.cos.secret-id=${PF_ASSET_COS_SECRET_ID:}
zhongshu.franchise.asset.storage.cos.secret-key=${PF_ASSET_COS_SECRET_KEY:}
zhongshu.franchise.asset.storage.cos.path-style-access=${PF_ASSET_COS_PATH_STYLE_ACCESS:false}
zhongshu.franchise.asset.storage.cos.api-call-timeout-ms=${PF_ASSET_COS_API_CALL_TIMEOUT_MS:20000}
# Content AI belongs to B. No design AI worker is packaged or registered here.
zhongshu.content.provider=${PF_CONTENT_PROVIDER:real}
zhongshu.content.task-sweep-enabled=${PF_CONTENT_TASK_SWEEP_ENABLED:true}
zhongshu.content.task-sweep-interval-ms=${PF_CONTENT_SWEEP_INTERVAL_MS:3000}
zhongshu.content.diadi.app-id=${PF_DIADI_APP_ID:}
zhongshu.content.diadi.app-secret=${PF_DIADI_APP_SECRET:}
zhongshu.content.dashscope.api-key=${PF_DASHSCOPE_API_KEY:}
zhongshu.content.deepseek.api-key=${PF_DEEPSEEK_API_KEY:}
zhongshu.content.hifly.api-key=${PF_HIFLY_API_KEY:}
zhongshu.content.metaso.api-key=${PF_METASO_API_KEY:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=db,redis,readinessState
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.env.show-values=NEVER
management.endpoint.configprops.show-values=NEVER
management.health.db.enabled=true
management.health.redis.enabled=true
spring.datasource.druid.stat-view-servlet.enabled=false
spring.datasource.druid.web-stat-filter.enabled=false
