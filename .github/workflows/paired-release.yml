name: Paired release rehearsal
on:
  push:
    branches: [backend-main]
  pull_request:
    branches: [backend-main]
  workflow_call:
    inputs:
      frontend_sha:
        description: Exact frontend commit selected by the caller
        required: true
        type: string
      backend_sha:
        description: Exact backend commit, or backend-main to freeze at checkout
        required: false
        default: backend-main
        type: string
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: Exact frontend commit, or main to freeze when this run starts
        required: true
        default: main
        type: string
      backend_sha:
        description: Exact backend commit, or backend-main to freeze at checkout
        required: true
        default: backend-main
        type: string

permissions:
  contents: read

concurrency:
  group: paired-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FRONTEND_REF: ${{ inputs.frontend_sha || 'main' }}
      BACKEND_REF: ${{ inputs.backend_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.backend_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve paired frontend branch for backend feature PRs
        if: github.event_name == 'pull_request' && inputs.frontend_sha == ''
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          candidate="${HEAD_BRANCH/-backend-/-}"
          if git ls-remote --exit-code origin "refs/heads/$candidate" >/dev/null 2>&1; then
            echo "FRONTEND_REF=$candidate" >> "$GITHUB_ENV"
            echo "Paired frontend branch: $candidate"
          else
            echo "No matching frontend branch found; retain configured FRONTEND_REF=$FRONTEND_REF"
          fi
      - name: Freeze the selected frontend and backend commits
        run: |
          test -f 平台程序/script/release-rehearsal/freeze_pair.py || { echo "::error::The selected backend predates the pairing scripts; choose a REL-01-or-newer backend or review its original run evidence."; exit 1; }
          python3 -I 平台程序/script/release-rehearsal/test_freeze_pair.py
          python3 -I 平台程序/script/release-rehearsal/freeze_pair.py
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '平台程序/**/pom.xml'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install production media decoders
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libheif-examples libheif-plugin-libde265 libheif-plugin-x265 libheif-plugin-aomdec
      - name: Check the frozen mini program
        working-directory: ${{ runner.temp }}/mini
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Build paired release and pre-spool baseline
        env:
          PREVIOUS_REV: ee7f20ff986b4fe0cc45d50b2e38c52a3d840a46
        run: |
          git worktree add --detach "$RUNNER_TEMP/previous" "$PREVIOUS_REV"
          mvn -B -ntp -f "$RUNNER_TEMP/previous/平台程序/pom.xml" -pl yudao-platform-server -am -Dmaven.test.skip=true package > "$RUNNER_TEMP/old-build.log" || { tail -60 "$RUNNER_TEMP/old-build.log"; exit 1; }
          mvn -B -ntp -f 平台程序/pom.xml -pl yudao-platform-server -am -Dmaven.test.skip=true package > "$RUNNER_TEMP/build.log" || { tail -60 "$RUNNER_TEMP/build.log"; exit 1; }
          cd 平台程序/admin-ui
          npx --yes pnpm@11.19.0 install --frozen-lockfile
          sed '/^NODE_ENV=/d' .env.example > .env.layout-release
          VITE_BASE_PATH=/admin/ node node_modules/vite/bin/vite.js build --mode layout-release
          cmp public/clone-replay-worker.js dist/clone-replay-worker.js
      - name: Exercise both actors with the pinned mini program and Spring controllers
        run: >-
          mvn -B -ntp -f 平台程序/pom.xml -pl domains/franchise/franchise-commission -am test
          -Dtest=HandoverFreezeIntegrationTest#receivingAnotherEngineersManualProjectRequiresExplicitTransfer
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dfranchise.handover.client="$RUNNER_TEMP/mini/scripts/verify-paired-handover.cjs"
      - name: Verify real content formats and canonical asset ownership
        run: >-
          mvn -B -ntp -f 平台程序/pom.xml -pl domains/franchise/franchise-asset -am test
          -Dtest=ContentMediaNormalizerTest,LocalAssetServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify immutable package, failed migration recovery and healthy rollbacks
        run: python3 平台程序/script/release-rehearsal/run.py
      - name: Summarize accepted pair
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          evidence = json.loads((Path(os.environ['RUNNER_TEMP']) / 'delivery' / 'acceptance.json').read_text())
          assert evidence['frontendCommit'] == os.environ['FRONTEND_REV']
          assert evidence['backendCommit'] == os.environ['BACKEND_REV']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n配对演练全部通过：上述两个提交的握手、不可变包、迁移恢复和回滚证据已生成。\n')
          PYTHON
      - name: Diagnose fixture boot failure
        if: failure()
        shell: bash
        run: |
          for service in zhongshu-platform-b-api-1 zhongshu-platform-b-postgres-b-1 zhongshu-platform-b-redis-b-1 paired-empty-engine; do
            if docker inspect "$service" --format '{{.Name}} {{.State.Status}} {{.State.ExitCode}}' 2>/dev/null; then
              docker logs --tail 600 "$service" 2>&1 | grep -Ei 'Caused by:|APPLICATION FAILED|permission denied|no space left|fatal:|unhealthy|configuration.*required' | grep -Eiv 'password|secret|credential|token|jdbc:' | tail -12 || true
            fi
          done
      - name: Store verified package and evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: paired-release
          path: ${{ runner.temp }}/delivery/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
