name: Paired release rehearsal
on:
  push:
    branches: [backend-main]
  pull_request:
    branches: [backend-main]
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      executor_sha:
        description: Immutable executor source, identical to the caller's uses pin
        required: true
        type: string
      frontend_sha:
        description: Exact frontend commit selected by the caller
        required: true
        type: string
      backend_sha:
        description: Exact backend commit, or backend-main to freeze at checkout
        required: false
        default: backend-main
        type: string
      require_external_handover:
        description: Require the real external handover test and frontend client
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: Exact frontend commit, or main to freeze when this run starts
        required: true
        default: main
        type: string
      backend_sha:
        description: Exact backend commit, or backend-main to freeze at checkout
        required: true
        default: backend-main
        type: string
      require_external_handover:
        description: Require the external handover chain (explicit SHA pairs always require it)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: paired-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_EXECUTOR_SHA: ${{ inputs.executor_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Validate the immutable executor source
        run: |
          python3 - <<'PYTHON'
          import os, re
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['EXPECTED_EXECUTOR_SHA']):
              raise SystemExit('Executor source must be one full lowercase commit SHA')
          PYTHON
      # Preserve the parser from the reviewed workflow source before checking out
      # a possibly older business backend. No PR body text is interpolated into run.
      - name: Check out the fixed executor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.EXPECTED_EXECUTOR_SHA }}
          path: .pair-executor
          persist-credentials: false
      - name: Select pair inputs from event data
        id: selection
        env:
          INPUT_EXECUTOR_SHA: ${{ inputs.executor_sha }}
          INPUT_FRONTEND_SHA: ${{ inputs.frontend_sha }}
          INPUT_BACKEND_SHA: ${{ inputs.backend_sha }}
          INPUT_REQUIRE_EXTERNAL: ${{ inputs.require_external_handover && 'true' || 'false' }}
        run: |
          python3 -I .pair-executor/平台程序/script/release-rehearsal/test_select_pair.py
          python3 -I .pair-executor/平台程序/script/release-rehearsal/test_freeze_pair.py
          python3 -I .pair-executor/平台程序/script/release-rehearsal/select_pair.py select
          mkdir -p "$RUNNER_TEMP/paired-executor-tools"
          cp .pair-executor/平台程序/script/release-rehearsal/select_pair.py .pair-executor/平台程序/script/release-rehearsal/freeze_pair.py "$RUNNER_TEMP/paired-executor-tools/"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.selection.outputs.backend_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze the selected frontend and backend commits
        env:
          FRONTEND_REF: ${{ steps.selection.outputs.frontend_ref }}
          BACKEND_REF: ${{ steps.selection.outputs.backend_ref }}
        run: python3 -I "$RUNNER_TEMP/paired-executor-tools/freeze_pair.py"
      - name: Determine external handover coverage for the frozen pair
        id: coverage
        run: python3 -I "$RUNNER_TEMP/paired-executor-tools/select_pair.py" capabilities
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '平台程序/**/pom.xml'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install production media decoders
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libheif-examples libheif-plugin-libde265 libheif-plugin-x265 libheif-plugin-aomdec
      - name: Check the frozen mini program
        working-directory: ${{ runner.temp }}/mini
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Build paired release and pre-spool baseline
        env:
          PREVIOUS_REV: ee7f20ff986b4fe0cc45d50b2e38c52a3d840a46
        run: |
          git worktree add --detach "$RUNNER_TEMP/previous" "$PREVIOUS_REV"
          mvn -B -ntp -f "$RUNNER_TEMP/previous/平台程序/pom.xml" -pl yudao-platform-server -am -Dmaven.test.skip=true package > "$RUNNER_TEMP/old-build.log" || { tail -60 "$RUNNER_TEMP/old-build.log"; exit 1; }
          mvn -B -ntp -f 平台程序/pom.xml -pl yudao-platform-server -am -Dmaven.test.skip=true package > "$RUNNER_TEMP/build.log" || { tail -60 "$RUNNER_TEMP/build.log"; exit 1; }
          cd 平台程序/admin-ui
          npx --yes pnpm@11.19.0 install --frozen-lockfile
          sed '/^NODE_ENV=/d' .env.example > .env.layout-release
          VITE_BASE_PATH=/admin/ node node_modules/vite/bin/vite.js build --mode layout-release
          cmp public/clone-replay-worker.js dist/clone-replay-worker.js
      - name: Exercise both actors with the pinned mini program and Spring controllers
        run: >-
          mvn -B -ntp -f 平台程序/pom.xml -pl domains/franchise/franchise-commission -am test
          -Dtest=HandoverFreezeIntegrationTest#receivingAnotherEngineersManualProjectRequiresExplicitTransfer
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dfranchise.handover.client="$RUNNER_TEMP/mini/scripts/verify-paired-handover.cjs"
      - name: Verify real content formats and canonical asset ownership
        run: >-
          mvn -B -ntp -f 平台程序/pom.xml -pl domains/franchise/franchise-asset -am test
          -Dtest=ContentMediaNormalizerTest,LocalAssetServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify external handover with the pinned mini program and real business services
        if: steps.coverage.outputs.run_external == 'true'
        run: |
          mvn -B -ntp -f 平台程序/pom.xml -pl domains/franchise/franchise-asset -am test \
            -Dtest=ExternalHandoverPgIntegrationTest#pairedMiniProgramRegistersExternalResultsAndReceivesOneEngineeringProject \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dfranchise.external-handover.client="$RUNNER_TEMP/mini/scripts/verify-paired-external-handover.cjs"
      - name: Verify immutable package, failed migration recovery and healthy rollbacks
        run: python3 平台程序/script/release-rehearsal/run.py
      - name: Summarize accepted pair
        run: python3 -I "$RUNNER_TEMP/paired-executor-tools/select_pair.py" summarize
      - name: Diagnose fixture boot failure
        if: failure()
        shell: bash
        run: |
          for service in zhongshu-platform-b-api-1 zhongshu-platform-b-postgres-b-1 zhongshu-platform-b-redis-b-1 paired-empty-engine; do
            if docker inspect "$service" --format '{{.Name}} {{.State.Status}} {{.State.ExitCode}}' 2>/dev/null; then
              docker logs --tail 600 "$service" 2>&1 | grep -Ei 'Caused by:|APPLICATION FAILED|permission denied|no space left|fatal:|unhealthy|configuration.*required' | grep -Eiv 'password|secret|credential|token|jdbc:' | tail -12 || true
            fi
          done
      - name: Store verified package and evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: paired-release
          path: ${{ runner.temp }}/delivery/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
