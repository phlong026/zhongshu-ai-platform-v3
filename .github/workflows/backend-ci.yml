name: Backend CI

on:
  pull_request:
    branches: [backend-main]
  push:
    branches: [backend-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finance-content:
    name: Finance and content tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '平台程序/**/pom.xml'
      - name: Build reactor dependencies
        run: >-
          mvn -B -ntp -f 平台程序/pom.xml
          -pl domains/franchise/franchise-finance,domains/franchise/franchise-content,domains/franchise/franchise-asset
          -am -DskipTests install
      - name: Install media decoders used in production
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libheif-examples libheif-plugin-libde265 libheif-plugin-x265 libheif-plugin-aomdec
      - name: Run full finance and content test suites
        run: >-
          mvn -B -ntp -f 平台程序/pom.xml
          -pl domains/franchise/franchise-finance,domains/franchise/franchise-content,domains/franchise/franchise-asset
          -DfailIfNoTests=true
          -Dplatform.test.jdbc.url=jdbc:postgresql://127.0.0.1:5432/postgres
          -Dplatform.test.jdbc.username=postgres
          -Dplatform.test.jdbc.password=postgres
          verify
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: backend-test-reports
          path: '平台程序/domains/franchise/*/target/surefire-reports/'
          retention-days: 7
          if-no-files-found: warn

  release-regression:
    name: Release regressions (PostgreSQL and Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '平台程序/**/pom.xml'
      - name: Validate delivered B Compose and reject unreviewed mounts
        run: |
          python3 -I 平台程序/script/verify-platform-deploy.py
          python3 -I 平台程序/deploy/platform/test_capability_deployment.py
      - name: Install media decoders used in production
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libheif-examples libheif-plugin-libde265 libheif-plugin-x265 libheif-plugin-aomdec
      - name: Test release paths and package the platform server
        # CONTENT_ASSET now verifies real media bytes; release tests need the same codecs as the image.
        run: >-
          mvn -B -ntp -f 平台程序/pom.xml
          -pl yudao-platform-server -am
          -Dtest=DepartureHandoverDomainsIntegrationTest,StaffIdentityWorkflowIntegrationTest,OrdinaryMemberRemovalIntegrationTest,StaffHandoverHistoryQueryIntegrationTest,StaffOrgAdminControllerTest,MemberRevocationPolicyIntegrationTest,DepartureHandoverServiceIntegrationTest,OperationsIntegrationTest,OrgPointHeadquartersIntegrationTest,SixRoleCommissionIntegrationTest,PerfFinanceWorkbenchIntegrationTest,CrmIntegrationTest,PerfCommissionExportPgIntegrationTest,FranchiseBusinessMessagesTest,MessageCenterReadSnapshotIntegrationTest,FranchiseAccountAuthServiceIntegrationTest,StaffWechatLoginIntegrationTest,TrainingIntegrationTest,AnnouncementIntegrationTest,FranchiseRolesTest,FranchiseSystemSeedTest,EngMaterialAndPlanGuardIntegrationTest,PublicCaseImageServiceTest,DesignAccessPublicCaseRoutingTest,DesignGenerationRetirementTest,FileServiceImplTest,LocalAssetServiceTest,CosObjectStorageAdapterTest,LocalAssetWiringTest,FinWorkbenchIntegrationTest,HandoverFreezeIntegrationTest,EngProgressCameraIntegrationTest,EngProgressTest,PerfCommissionUnifiedBalanceTest,ContentTaskResultSweepTest,OrgPointFlywayUpgradeIntegrationTest,StaffImportServiceIntegrationTest,StaffImportTransactionIntegrationTest,StaffImportServicePiiLogTest,StaffImportControllerHttpContractTest,StaffImportControllerConditionalTest,StaffImportAccessLogFilterTest,FranchiseDirectoryIntegrationTest,FranchiseDirectoryWorkbookTest,FranchiseRegionCatalogTest,FranchiseDirectorySecurityTest,FranchiseOnboardIntegrationTest,MyPostControllerTest,RequestCurrentPostTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dplatform.test.jdbc.url=jdbc:postgresql://127.0.0.1:5432/postgres
          -Dplatform.test.jdbc.username=postgres
          -Dplatform.test.jdbc.password=postgres
          -Dplatform.test.redis.address=redis://127.0.0.1:6379
          package
      - name: Upload release regression reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: backend-release-regression-reports
          path: '平台程序/**/target/surefire-reports/'
          retention-days: 7
          if-no-files-found: warn

  upload-web:
    name: File-backed browser upload
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 平台程序/admin-ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked admin dependencies
        run: npx --yes pnpm@11.19.0 install --frozen-lockfile
      - name: Test file streaming and build the embedded page
        run: |
          node --test src/clone-upload/transfer.test.mjs
          node --test tests/platform-staff-workspace.test.js tests/staff-import.test.js tests/staff-import-submit.test.js tests/store-staff-account.test.js tests/franchise-directory.test.js tests/franchise-onboard.test.js tests/platform-announcements.test.js
          VITE_BASE_PATH=/admin/ npm run build:prod
          test -s dist/clone-upload.html
      - name: Play uploaded video and audio in a fresh web view
        run: |
          python3 -m pip install playwright==1.65.2
          python3 tests/clone_replay.py
