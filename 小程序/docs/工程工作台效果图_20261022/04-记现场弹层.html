<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>工程工作台 · 记现场弹层</title>
<link rel="stylesheet" href="style.css">
<style>
body{height:812px;overflow:hidden;position:relative}
iframe{border:0;width:375px;height:812px;display:block}
.mask{position:absolute;inset:0;background:rgba(20,15,10,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:8px 16px 30px}
.grip{width:36px;height:4px;border-radius:2px;background:#ddd6cc;margin:0 auto 10px}
.sh{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.sh h3{font-size:18px;line-height:25px}
.x{font-size:20px;color:#9a948d;line-height:20px}
.where{display:flex;align-items:center;gap:6px;font-size:13px;color:#5f5a55;margin-top:3px}
.where b{color:var(--brown-d);font-weight:600}
.ups{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ups img,.ups .add{width:100%;height:72px;border-radius:8px;object-fit:cover}
.ups .add{border:1.5px dashed #d6c8b6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);gap:2px}
.ups .add .ico{width:22px;height:22px}
.say{margin-top:12px;background:#faf7f2;border-radius:10px;padding:11px 12px}
.say .txt{font-size:14.5px;line-height:22px;color:#2b2723}
.say .src{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);margin-top:6px}
.mic{margin-top:10px;height:46px;border-radius:23px;border:1.5px solid var(--brown);color:var(--brown-d);display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:600}
.mic .ico{stroke:var(--brown-d)}
.lab{font-size:13px;color:#5f5a55;margin:14px 0 8px}
.opt{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.opt span{height:36px;line-height:34px;text-align:center;border:1px solid #e3dbd0;border-radius:8px;font-size:13.5px;color:#5f5a55}
.opt span.on{border-color:var(--brown);background:#fffaf4;color:var(--brown-d);font-weight:600}
.note{font-size:12px;color:var(--muted);margin:12px 0 10px;text-align:center}
</style></head>
<body>
<iframe src="02-进度材料-施工进度.html" scrolling="no"></iframe>
<div class="mask"></div>
<div class="sheet">
  <div class="grip"></div>
  <div class="sh"><div><h3>记现场</h3><div class="where">陈先生 · 麻城宋埠 ▾<span style="color:#d8cfc4">|</span>节点 <b>二层主体</b></div></div><span class="x">×</span></div>

  <div class="ups">
    <img src="../../miniprogram/pages/build/assets/site.jpg">
    <img src="../../miniprogram/pages/build/assets/rectify-after.jpg">
    <img src="../../miniprogram/pages/build/assets/foundation.jpg">
    <div class="add"><svg class="ico" viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2l1.5-2h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>继续拍</div>
  </div>

  <div class="say">
    <div class="txt">二层楼板模板支好了，钢筋绑了七成，班组 8 个人。明早 7 点打混凝土。</div>
    <div class="src"><svg class="ico" viewBox="0 0 24 24" style="width:13px;height:13px;stroke:var(--muted)"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>语音转文字 · 可直接修改</div>
  </div>
  <div class="mic"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>按住说话</div>

  <div class="lab">今天工地</div>
  <div class="opt"><span class="on">正常施工</span><span>下雨停工</span><span>等材料</span><span>其他</span></div>

  <div class="note">保存后自动归到「二层主体的记录」，日期时间自动带上</div>
  <span class="btn block">保存记录</span>
</div>
</body></html>
